name: Daily Shyam Krishna Reel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "state/rotation_state.json"
  schedule:
    # GitHub cron uses UTC. India Standard Time is UTC+05:30.
    # 6:00 AM IST = 00:30 UTC
    # 6:00 PM IST = 12:30 UTC
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
permissions:
  contents: write

concurrency:
  group: daily-shyam-krishna-reel
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Expose optional secrets to job-level env so GitHub can safely use
      # them in step conditions. Missing secrets become empty strings.
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate moving reel
        run: python src/main.py

      # Always keep the MP4 in Actions artifacts.
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-shyam-krishna-reel-${{ github.run_number }}
          path: |
            output/daily_reel.mp4
            output/caption.txt
            output/selection.json
          retention-days: 7

      # Instagram's Graph API needs a publicly reachable HTTPS video URL.
      # This creates one automatically from a GitHub Release asset.
      # No INSTAGRAM_VIDEO_URL secret is required.
      - name: Create temporary public Instagram video URL
        if: ${{ env.IG_USER_ID != '' && env.IG_ACCESS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VISIBILITY="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          if [ "$VISIBILITY" != "public" ]; then
            echo "::error::Instagram automatic publishing requires this GitHub repository to be public because the release MP4 must be publicly downloadable."
            exit 1
          fi

          TAG="daily-reel-${GITHUB_RUN_ID}"
          echo "Creating public release: ${TAG}"

          gh release create "$TAG" \
            output/daily_reel.mp4 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Daily Reel ${GITHUB_RUN_NUMBER}" \
            --notes "Automatically generated devotional reel for Instagram publishing."

          # gh release view --json assets does not reliably expose
          # browser_download_url across GitHub CLI versions. The public
          # download URL is deterministic for a GitHub release asset.
          VIDEO_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/daily_reel.mp4"

          # Make the release tag available to the cleanup step immediately.
          echo "INSTAGRAM_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          # Confirm GitHub can see the asset before handing the URL to Meta.
          echo "Waiting for the public release asset to become available..."
          AVAILABLE=0
          for attempt in $(seq 1 12); do
            HTTP_CODE="$(curl -L -s -o /dev/null -w '%{http_code}' "$VIDEO_URL" || true)"
            echo "Release asset check ${attempt}/12: HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ]; then
              AVAILABLE=1
              break
            fi
            sleep 5
          done

          if [ "$AVAILABLE" -ne 1 ]; then
            echo "::error::GitHub release asset is not publicly downloadable after waiting."
            exit 1
          fi

          echo "Instagram video URL created automatically: $VIDEO_URL"
          echo "INSTAGRAM_VIDEO_URL=$VIDEO_URL" >> "$GITHUB_ENV"

      - name: Publish to Facebook
        run: python src/publish.py facebook

      - name: Publish to Instagram
        run: python src/publish.py instagram

      - name: Cleanup temporary Instagram release
        if: ${{ always() && env.INSTAGRAM_RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$INSTAGRAM_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            --cleanup-tag || true

      - name: Commit rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/rotation_state.json
          git diff --cached --quiet || git commit -m "chore: update reel rotation state"
          git push
