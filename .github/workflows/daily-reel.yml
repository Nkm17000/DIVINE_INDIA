name: Daily Shyam Krishna Reel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "state/rotation_state.json"
  schedule:
    # 5:00 AM IST = 23:30 UTC
    - cron: "30 23 * * *"

permissions:
  contents: write

concurrency:
  group: daily-shyam-krishna-reel
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate moving reel
        run: |
          python src/main.py

      # ALWAYS upload the generated video, regardless of Meta publishing.
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-shyam-krishna-reel-${{ github.run_number }}
          path: |
            output/daily_reel.mp4
            output/caption.txt
            output/selection.json
          retention-days: 7

      - name: Publish to Facebook (optional)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
        run: python src/publish.py facebook

      - name: Publish to Instagram (optional)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INSTAGRAM_VIDEO_URL: ${{ secrets.INSTAGRAM_VIDEO_URL }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
        run: python src/publish.py instagram

      - name: Commit rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/rotation_state.json
          git diff --cached --quiet || git commit -m "chore: update reel rotation state"
          git push
