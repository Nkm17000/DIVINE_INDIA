name: Daily Shyam Krishna Reel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "state/rotation_state.json"
  schedule:
    # 5:00 AM IST = 23:30 UTC
    - cron: "30 23 * * *"

permissions:
  contents: write

concurrency:
  group: daily-shyam-krishna-reel
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate moving reel
        run: python src/main.py

      # Always keep the MP4 in Actions artifacts.
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-shyam-krishna-reel-${{ github.run_number }}
          path: |
            output/daily_reel.mp4
            output/caption.txt
            output/selection.json
          retention-days: 7

      # Instagram's Graph API needs a publicly reachable HTTPS video URL.
      # This creates one automatically from a GitHub Release asset.
      # No INSTAGRAM_VIDEO_URL secret is required.
      - name: Create temporary public Instagram video URL
        if: ${{ env.IG_USER_ID != '' && env.IG_ACCESS_TOKEN != '' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VISIBILITY="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          if [ "$VISIBILITY" != "public" ]; then
            echo "::error::Instagram automatic publishing requires this GitHub repository to be public because the release MP4 must be publicly downloadable."
            exit 1
          fi

          TAG="daily-reel-${GITHUB_RUN_ID}"
          echo "Creating public release: ${TAG}"

          gh release create "$TAG" \
            output/daily_reel.mp4 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Daily Reel ${GITHUB_RUN_NUMBER}" \
            --notes "Automatically generated devotional reel for Instagram publishing."

          VIDEO_URL="$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name=="daily_reel.mp4") | .url')"

          if [ -z "$VIDEO_URL" ]; then
            echo "::error::Could not obtain the public GitHub release asset URL."
            exit 1
          fi

          echo "Instagram video URL created automatically."
          echo "INSTAGRAM_VIDEO_URL=$VIDEO_URL" >> "$GITHUB_ENV"
          echo "INSTAGRAM_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python src/publish.py facebook

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python src/publish.py instagram

      - name: Cleanup temporary Instagram release
        if: ${{ always() && env.INSTAGRAM_RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$INSTAGRAM_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            --cleanup-tag || true

      - name: Commit rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/rotation_state.json
          git diff --cached --quiet || git commit -m "chore: update reel rotation state"
          git push
