name: Daily Divine India Reels

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "state/rotation_state.json"
      - "output/**"
  schedule:
    # 6:00 AM and 6:00 PM India Standard Time (UTC+05:30)
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: divine-india-reels
  cancel-in-progress: false

jobs:
  generate:
    name: Generate reels once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate one video per eligible deity folder
        run: python src/main.py
      - name: Upload generated reels for both publishing jobs
        uses: actions/upload-artifact@v4
        with:
          name: divine-india-reels-${{ github.run_id }}
          path: |
            output/*/daily_reel*.mp4
            output/*/caption.txt
            output/*/selection*.json
          retention-days: 1
          if-no-files-found: error
      - name: Commit and push persistent media-combination history (retry)
        if: always()
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/rotation_state.json
          if git diff --cached --quiet; then
            echo "No rotation history changes to commit."
            exit 0
          fi
          git commit -m "chore: update deity media combination history"

          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            echo "Git push attempt ${attempt}/3 to ${branch}"
            if git push origin "HEAD:${branch}"; then
              echo "Rotation history pushed successfully."
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::warning::Could not push rotation history after 3 attempts. Publishing jobs will still run; the history commit remains local to this runner and may not persist."
          # Do not fail the generate job solely because GitHub was unreachable.
          # Both publishing jobs depend on generate and should still be allowed to run.
          exit 0

  publish-facebook:
    name: Publish all Facebook Pages
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      META_GRAPH_VERSION: v24.0
      FB_PAGE_KEY: ${{ secrets.FB_PAGE_KEY }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_KEY_2: ${{ secrets.FB_PAGE_KEY_2 }}
      FB_PAGE_TOKEN_2: ${{ secrets.FB_PAGE_TOKEN_2 }}
      FB_PAGE_KEY_3: ${{ secrets.FB_PAGE_KEY_3 }}
      FB_PAGE_TOKEN_3: ${{ secrets.FB_PAGE_TOKEN_3 }}
      FB_PAGE_KEY_4: ${{ secrets.FB_PAGE_KEY_4 }}
      FB_PAGE_TOKEN_4: ${{ secrets.FB_PAGE_TOKEN_4 }}
      FB_PAGE_KEY_5: ${{ secrets.FB_PAGE_KEY_5 }}
      FB_PAGE_TOKEN_5: ${{ secrets.FB_PAGE_TOKEN_5 }}
      FB_PAGE_KEY_6: ${{ secrets.FB_PAGE_KEY_6 }}
      FB_PAGE_TOKEN_6: ${{ secrets.FB_PAGE_TOKEN_6 }}
      FB_PAGE_KEY_7: ${{ secrets.FB_PAGE_KEY_7 }}
      FB_PAGE_TOKEN_7: ${{ secrets.FB_PAGE_TOKEN_7 }}
      FB_PAGE_KEY_8: ${{ secrets.FB_PAGE_KEY_8 }}
      FB_PAGE_TOKEN_8: ${{ secrets.FB_PAGE_TOKEN_8 }}
      FB_PAGE_KEY_9: ${{ secrets.FB_PAGE_KEY_9 }}
      FB_PAGE_TOKEN_9: ${{ secrets.FB_PAGE_TOKEN_9 }}
      FB_PAGE_KEY_10: ${{ secrets.FB_PAGE_KEY_10 }}
      FB_PAGE_TOKEN_10: ${{ secrets.FB_PAGE_TOKEN_10 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download generated reels
        uses: actions/download-artifact@v4
        with:
          name: divine-india-reels-${{ github.run_id }}
          path: output
      - name: Publish to all configured Facebook Pages
        run: python src/publish.py facebook

  publish-instagram:
    name: Publish all Instagram accounts
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      META_GRAPH_VERSION: v24.0
      INSTA_PAGE_KEY: ${{ secrets.INSTA_PAGE_KEY }}
      INSTA_PAGE_TOKEN: ${{ secrets.INSTA_PAGE_TOKEN }}
      INSTA_PAGE_KEY_2: ${{ secrets.INSTA_PAGE_KEY_2 }}
      INSTA_PAGE_TOKEN_2: ${{ secrets.INSTA_PAGE_TOKEN_2 }}
      INSTA_PAGE_KEY_3: ${{ secrets.INSTA_PAGE_KEY_3 }}
      INSTA_PAGE_TOKEN_3: ${{ secrets.INSTA_PAGE_TOKEN_3 }}
      INSTA_PAGE_KEY_4: ${{ secrets.INSTA_PAGE_KEY_4 }}
      INSTA_PAGE_TOKEN_4: ${{ secrets.INSTA_PAGE_TOKEN_4 }}
      INSTA_PAGE_KEY_5: ${{ secrets.INSTA_PAGE_KEY_5 }}
      INSTA_PAGE_TOKEN_5: ${{ secrets.INSTA_PAGE_TOKEN_5 }}
      INSTA_PAGE_KEY_6: ${{ secrets.INSTA_PAGE_KEY_6 }}
      INSTA_PAGE_TOKEN_6: ${{ secrets.INSTA_PAGE_TOKEN_6 }}
      INSTA_PAGE_KEY_7: ${{ secrets.INSTA_PAGE_KEY_7 }}
      INSTA_PAGE_TOKEN_7: ${{ secrets.INSTA_PAGE_TOKEN_7 }}
      INSTA_PAGE_KEY_8: ${{ secrets.INSTA_PAGE_KEY_8 }}
      INSTA_PAGE_TOKEN_8: ${{ secrets.INSTA_PAGE_TOKEN_8 }}
      INSTA_PAGE_KEY_9: ${{ secrets.INSTA_PAGE_KEY_9 }}
      INSTA_PAGE_TOKEN_9: ${{ secrets.INSTA_PAGE_TOKEN_9 }}
      INSTA_PAGE_KEY_10: ${{ secrets.INSTA_PAGE_KEY_10 }}
      INSTA_PAGE_TOKEN_10: ${{ secrets.INSTA_PAGE_TOKEN_10 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download generated reels
        uses: actions/download-artifact@v4
        with:
          name: divine-india-reels-${{ github.run_id }}
          path: output
      - name: Check whether Instagram accounts are configured
        id: account-check
        run: python src/publish.py has-instagram >> "$GITHUB_OUTPUT"
      - name: Create temporary public URLs for Instagram
        if: ${{ steps.account-check.outputs.has_instagram == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VISIBILITY="$(gh api "repos/${{ github.repository }}" --jq '.visibility')"
          if [[ "$VISIBILITY" != "public" ]]; then
            echo "::error::Instagram Reels require public HTTPS video URLs. This workflow uses GitHub Release assets, so the repository must be public."
            exit 1
          fi
          mkdir -p output/release-assets
          shopt -s nullglob
          for video in output/*/daily_reel*.mp4; do
            [[ -f "$video" ]] || continue
            folder="$(basename "$(dirname "$video")")"
            filename="$(basename "$video")"
            cp "$video" "output/release-assets/${folder}__${filename}"
          done
          files=(output/release-assets/*.mp4)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No generated MP4 files found for Instagram publishing."
            exit 1
          fi
          TAG="daily-reel-${{ github.run_id }}"
          gh release create "$TAG" "${files[@]}" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Temporary Divine India Reels ${{ github.run_number }}" \
            --notes "Temporary public video URLs for Meta publishing; cleaned after this workflow."
          echo "INSTAGRAM_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          python - <<'PYCODE'
          import json, os, pathlib
          repo = os.environ['GITHUB_REPOSITORY']
          tag = f"daily-reel-{os.environ['GITHUB_RUN_ID']}"
          urls = {}
          for path in sorted(pathlib.Path('output/release-assets').glob('*.mp4')):
              folder, filename = path.name.split('__', 1)
              urls[f"{folder}/{filename}"] = f"https://github.com/{repo}/releases/download/{tag}/{path.name}"
          with open('output/instagram_video_urls.json', 'w', encoding='utf-8') as urls_file:
              json.dump(urls, urls_file)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write('INSTAGRAM_VIDEO_URLS_JSON=' + json.dumps(urls) + '\n')
          print('Created public URLs for:', ', '.join(urls))
          PYCODE
          while IFS= read -r url; do
            [[ -n "$url" ]] || continue
            code=""
            for attempt in $(seq 1 12); do
              code="$(curl -L -s -o /dev/null -w '%{http_code}' "$url" || true)"
              [[ "$code" == "200" ]] && break
              sleep 5
            done
            [[ "$code" == "200" ]] || { echo "::error::Release asset not publicly available: $url"; exit 1; }
          done < <(python -c 'import json; print("\n".join(json.load(open("output/instagram_video_urls.json")).values()))')
      - name: Publish to all configured Instagram accounts
        if: ${{ steps.account-check.outputs.has_instagram == 'true' }}
        run: python src/publish.py instagram
      - name: Delete temporary public video release
        if: ${{ always() && env.INSTAGRAM_RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$INSTAGRAM_RELEASE_TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
