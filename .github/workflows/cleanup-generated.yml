name: Daily Generated Artifact Cleanup

on:
  workflow_dispatch:
  schedule:
    # Every day at 03:15 UTC (08:45 AM India Standard Time)
    - cron: "15 3 * * *"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete GitHub Actions artifacts older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' +%s)"
          gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .created_at] | @tsv' |
          while IFS=$'\t' read -r artifact_id created_at; do
            [[ -n "${artifact_id:-}" ]] || continue
            created="$(date -u -d "$created_at" +%s)"
            if (( created < cutoff )); then
              echo "Deleting Actions artifact ${artifact_id} created ${created_at}"
              gh api --method DELETE "repos/${REPO}/actions/artifacts/${artifact_id}" || true
            fi
          done
      - name: Delete temporary reel releases older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' +%s)"
          gh api --paginate "repos/${REPO}/releases?per_page=100" --jq '.[] | [.id, .tag_name, .created_at] | @tsv' |
          while IFS=$'\t' read -r release_id tag created_at; do
            [[ "${tag:-}" == daily-reel-* ]] || continue
            [[ -n "${release_id:-}" ]] || continue
            created="$(date -u -d "$created_at" +%s)"
            if (( created < cutoff )); then
              echo "Deleting stale temporary release ${tag}"
              gh api --method DELETE "repos/${REPO}/releases/${release_id}" || true
              gh api --method DELETE "repos/${REPO}/git/refs/tags/${tag}" || true
            fi
          done
      - name: Remove generated files in the runner workspace older than 24 hours
        run: |
          find output -type f -mmin +1440 -print -delete 2>/dev/null || true
          find output -depth -type d -empty -delete 2>/dev/null || true
